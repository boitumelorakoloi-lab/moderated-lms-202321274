name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsqlite3-dev libsodium-dev libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Unit and integration tests
        run: ctest --test-dir build -L "unit|integration" --output-on-failure

      - name: System tests
        run: ctest --test-dir build -L system --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format

      - name: cppcheck (fails on any finding)
        run: |
          cppcheck --std=c++17 --enable=warning,style,performance,portability \
                   --inline-suppr --suppress=missingIncludeSystem --error-exitcode=1 -q -I src src

      - name: Formatting matches .clang-format (Coding Standard L1-L4)
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsqlite3-dev libsodium-dev libgtest-dev gcovr

      - name: Build with coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DLMS_COVERAGE=ON
          cmake --build build-cov -j

      - name: Run tests
        run: ctest --test-dir build-cov -L "unit|integration" --output-on-failure

      - name: Coverage of the business-logic layer (target 70%)
        run: |
          mkdir -p coverage
          gcovr -r . build-cov --filter 'src/services/' --filter 'src/domain/' \
                --html-details coverage/index.html --print-summary --fail-under-line 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Phase 7: build the release packages on every push; when a tag such as v1.0 is pushed,
  # publish them on the GitHub Releases page together with the release notes.
  package:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsqlite3-dev libsodium-dev mingw-w64 zip

      - name: Ubuntu package (.deb)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMS_BUILD_TESTS=OFF
          cmake --build build -j
          (cd build && cpack -G DEB)
          mkdir -p dist && cp build/*.deb dist/

      - name: Windows package (.zip)
        run: bash packaging/build-windows.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
